# Сборка релизов. Запускается тремя способами:
#   * поднята <Version> в Directory.Build.props и запушена в main — версия
#     выпускается автоматически, тег v<версия> создаётся сам (обычный путь);
#   * пуш тега v* — то же самое, если тег ставят руками;
#   * вручную (workflow_dispatch) — только артефакты, без релиза.
# Собираются четыре архива для Linux x64 —
# сервер и проба, каждый в двух вариантах:
#   * framework — маленький дистрибутив, требует установленного .NET Runtime на хосте;
#   * selfcontained — самодостаточный (один исполняемый файл со всеми библиотеками
#     плюс конфиги/twampy/wwwroot рядом): скопировал папку — и запустил, ничего
#     дополнительно ставить не нужно.
# Каждый архив — это упакованная папка публикации целиком.
name: release

on:
  push:
    tags: [ "v*" ]
    # Релиз выпускается и просто по изменению версии в main: поднял <Version>
    # в Directory.Build.props, запушил — архивы собрались, тег создался сам.
    # Отдельным workflow это сделать нельзя: тег, созданный штатным GITHUB_TOKEN,
    # не запускает другие workflow (защита GitHub от рекурсии), поэтому выпуск
    # версии и сборка живут в одном месте.
    branches: [ main ]
    paths: [ "Directory.Build.props" ]
  workflow_dispatch:

permissions:
  contents: write   # создание релиза и загрузка архивов

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Установка .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Юнит-тесты
        run: dotnet test SPI.Twamp.Tests/SPI.Twamp.Tests.csproj -c Release

      - name: Публикация 4 вариантов (linux-x64)
        run: |
          set -e
          # Откуда версия и выпускать ли релиз:
          #   * запуск по тегу v1.2.3      — версия из тега, релиз выпускаем;
          #   * push в main с новой версией — версия из Directory.Build.props,
          #     релиз выпускаем и создаём тег (если такого тега ещё нет);
          #   * ручной запуск              — предрелизная версия, только артефакты.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            RELEASE=1
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)
            [ -n "$VERSION" ] || { echo "::error::в Directory.Build.props нет <Version>"; exit 1; }
            RELEASE=1
            # Версия уже выпущена — значит правили файл, а не поднимали версию.
            if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
              echo "Версия $VERSION уже выпущена — собираем только артефакты"
              RELEASE=0
              VERSION="manual-${GITHUB_SHA::8}"
            fi
          else
            VERSION="manual-${GITHUB_SHA::8}"
            RELEASE=0
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"

          # Версия для .NET-сборок: из тега (например 1.2.0); для ручного запуска —
          # предрелизная 0.0.1-<sha>. Прошивается в AssemblyVersion — сервер видит её
          # в списке проб, и по ней легко найти отставшие после раскатки.
          NETVER="$VERSION"
          [ "$RELEASE" = "1" ] || NETVER="0.0.1-${GITHUB_SHA::8}"
          echo "NETVER=$NETVER" >> "$GITHUB_ENV"

          publish_one () {
            local proj="$1" name="$2" variant="$3"; shift 3
            local out="publish/${name}-${variant}"
            dotnet publish "$proj" -c Release -r linux-x64 -o "$out" -p:Version="$NETVER" "$@"
            # Папка публикации целиком уходит в архив с сохранением прав на запуск.
            tar -C "$out" -czf "publish/${name}-${VERSION}-linux-x64-${variant}.tar.gz" .
          }

          # Маленькие сборки: без библиотек .NET, на хосте нужен установленный .NET 10 Runtime (ASP.NET Core).
          publish_one SPI.Twamp.Server/SPI.Twamp.Server.csproj twamp-server framework --self-contained false

          # Самодостаточные сборки: один исполняемый файл, .NET не требуется.
          publish_one SPI.Twamp.Server/SPI.Twamp.Server.csproj twamp-server selfcontained \
            --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true

          ls -lh publish/*.tar.gz

      - name: Установка Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: go-probe/go.sum

      # Go-проба: один статический бинарник ~6 МБ без зависимостей. Linux-вариант
      # работает на любом дистрибутиве x86-64 (CentOS 7+, Rocky, Alma, Ubuntu…),
      # Windows-вариант — на Windows 10+/Server. Итого в релизе 6 архивов.
      # twping для режима TWamp кладём прямо в linux-пакет пробы, чтобы на хосте
      # ничего не доустанавливать. Берём готовый бинарник из релиза perfSONAR для
      # el7 (CentOS 7): он собран под glibc 2.14 и тянет только libm, libc и libcap —
      # то есть работает и на CentOS 7, и на любом дистрибутиве новее.
      - name: twping из релизного пакета perfSONAR (el7/CentOS 7)
        run: |
          set -e
          RPM=twamp-client-5.0.8-1.el7.x86_64.rpm
          curl -fsSL --retry 3 -o "$RPM" \
            "http://software.internet2.edu/rpms/el7/x86_64/main/RPMS/$RPM"
          command -v rpm2cpio >/dev/null || sudo apt-get install -y -qq rpm
          rpm2cpio "$RPM" | cpio -idm ./usr/bin/twping
          install -m 0755 usr/bin/twping go-probe/twping

          # Страховка: пакет должен остаться совместимым с CentOS 7 (glibc 2.17).
          need=$(readelf -V go-probe/twping | grep -o 'GLIBC_2\.[0-9]*' | sort -uV | tail -1)
          echo "twping требует не выше $need"
          [ "$need" = "GLIBC_2.14" ] || { echo "::error::twping требует $need — новее, чем glibc в CentOS 7"; exit 1; }

      - name: Сборка Go-пробы (linux-x64 + windows-x64, тесты)
        run: |
          set -e
          cd go-probe
          go vet ./...
          go test ./...

          assemble () { # $1 — папка, $2 — бинарник, $3 — конфиг
            mkdir -p "$1"
            cp -r ../SPI.TWamp.Probe/twampy "$1/twampy"
            rm -rf "$1/twampy/__pycache__"
            cp "deploy/$3" "$1/appsettings.json"
            cp deploy/README-DEPLOY.txt "$1/"
          }

          # Версия прошивается в бинарник и видна серверу в списке проб.
          LDFLAGS="-s -w -X main.probeVersion=${VERSION}-go"

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/twamp-probe-go/twamp-probe .
          assemble dist/twamp-probe-go twamp-probe appsettings.json
          # Зонд TWamp — рядом с пробой: настройка twamp:name по умолчанию как раз «./twping».
          install -m 0755 twping dist/twamp-probe-go/twping
          tar -C dist -czf "../publish/twamp-probe-go-${VERSION}-linux-x64.tar.gz" twamp-probe-go

          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="$LDFLAGS" -o dist/twamp-probe-go-win/twamp-probe.exe .
          assemble dist/twamp-probe-go-win twamp-probe.exe appsettings.windows.json
          (cd dist && zip -qr "../../publish/twamp-probe-go-${VERSION}-windows-x64.zip" twamp-probe-go-win)

          ls -lh ../publish/twamp-probe-go-*

      # Запуск без выпуска версии: архивы доступны как артефакты workflow.
      - name: Артефакты (без выпуска релиза)
        if: env.RELEASE != '1'
        uses: actions/upload-artifact@v4
        with:
          name: twamp-${{ env.VERSION }}
          path: |
            publish/*.tar.gz
            publish/*.zip
          retention-days: 14

      # Выпуск версии: создаётся GitHub Release с четырьмя архивами. При запуске
      # по изменению версии в main тег v<версия> создаётся здесь же.
      - name: GitHub Release
        if: env.RELEASE == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: |
            publish/*.tar.gz
            publish/*.zip
          generate_release_notes: true
          body: |
            Сборки для Linux x64 (в каждом архиве — папка приложения целиком):

            | Архив | Что это | Требования на хосте |
            |---|---|---|
            | `twamp-server-*-framework.tar.gz` | сервер, маленький | .NET 10 Runtime (ASP.NET Core) |
            | `twamp-server-*-selfcontained.tar.gz` | сервер, самодостаточный | нет — распаковал и запустил |
            | `twamp-probe-go-*-linux-x64.tar.gz` | **проба (Go)** для Linux — один статический бинарник ~6 МБ | нет; для TWampy — Python 3.8+ |
            | `twamp-probe-go-*-windows-x64.zip` | **проба (Go)** для Windows | нет; для TWampy — Python 3.8+ |
