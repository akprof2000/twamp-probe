[package]
name = "twamp-probe-rust"
version = "0.0.0"           # реальную версию прошивает сборка через --config
edition = "2021"
description = "SPI TWamp Probe — экспериментальный порт пробы на Rust"

[[bin]]
name = "twamp-probe"
path = "src/main.rs"

[dependencies]
tiny_http = "0.12"                                    # блокирующий HTTP-сервер без async-рантайма
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }    # разбор/формат дат контракта (CsTime)
cron = "0.12"                                          # разбор cron-выражений расписания

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
