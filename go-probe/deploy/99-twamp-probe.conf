# Настройки ядра для SPI TWamp Probe (CentOS/RHEL и другие Linux).
# Кладётся в /etc/sysctl.d/99-twamp-probe.conf, применяется: sysctl --system
#
# Смысл всех значений один: проба на пике держит тысячи процессов зондов, и
# каждый такой замер занимает две учётные единицы ядра — сам процесс и поток
# пробы, ожидающий его завершения.

# Идентификаторы задач. Их расходуют и процессы, и потоки, поэтому N замеров
# внешними утилитами требуют около 2N идентификаторов — плюс всё остальное,
# что работает на машине. Значение по умолчанию (32768) кончается быстро;
# 4194304 — максимум для 64-битных ядер.
kernel.pid_max = 4194304

# Общее число потоков в системе. По умолчанию вычисляется из объёма памяти и
# обычно достаточно, но на машинах с малым ОЗУ оказывается тесным.
kernel.threads-max = 262144

# Верхняя граница для LimitNOFILE: без неё systemd не сможет поднять лимит
# дескрипторов службе.
fs.nr_open = 1048576

# Диапазон исходящих портов ядра. Разведён с пулом пробы по построению:
# пул занимает 9000–65000 (Probe:PortRange), ядру остаётся всё, что ниже.
#
# Так пересечься они не могут в принципе, и ip_local_reserved_ports не нужен:
# резервировать пул размером 56 тысяч портов нельзя — ядру не осталось бы
# ничего на исходящие соединения. Раньше пул был меньше (20000–32767) и
# резервировался списком; с большим пулом проще отдать ядру нижний участок.
#
# ВАЖНО: эти ~8 тысяч портов ядро тратит на исходящие TCP-соединения, и одно
# такое соединение нужно каждому замеру TWamp — управляющий канал twping идёт
# по TCP. То есть верхняя граница здесь — около 8 тысяч одновременных замеров
# TWamp. Нужно больше — сдвигайте нижнюю границу Probe:PortRange вверх
# (например 16000–65000) и расширяйте этот диапазон соответственно.
#
# Меняете Probe:PortRange — меняйте и эту строку: они обязаны не пересекаться.
net.ipv4.ip_local_port_range = 1024 8999

# Ускоряет возврат портов из TIME_WAIT для исходящих соединений.
net.ipv4.tcp_tw_reuse = 1

# Очередь приёма для HTTP-сервера пробы: сервер опрашивает её пачками задач.
net.core.somaxconn = 4096
