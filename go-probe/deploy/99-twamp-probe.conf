# Настройки ядра для SPI TWamp Probe (CentOS/RHEL и другие Linux).
# Кладётся в /etc/sysctl.d/99-twamp-probe.conf, применяется: sysctl --system
#
# Смысл всех значений один: проба на пике держит тысячи процессов зондов, и
# каждый такой замер занимает две учётные единицы ядра — сам процесс и поток
# пробы, ожидающий его завершения.

# Идентификаторы задач. Их расходуют и процессы, и потоки, поэтому N замеров
# внешними утилитами требуют около 2N идентификаторов — плюс всё остальное,
# что работает на машине. Значение по умолчанию (32768) кончается быстро;
# 4194304 — максимум для 64-битных ядер.
kernel.pid_max = 4194304

# Общее число потоков в системе. По умолчанию вычисляется из объёма памяти и
# обычно достаточно, но на машинах с малым ОЗУ оказывается тесным.
kernel.threads-max = 262144

# Верхняя граница для LimitNOFILE: без неё systemd не сможет поднять лимит
# дескрипторов службе.
fs.nr_open = 1048576

# Диапазон исходящих портов ядра. Разведён с пулом пробы (Probe:PortRange =
# 25000-65000): пересекаться им нельзя.
#
# Почему нельзя. Ядро выбирает эфемерный порт, проверяя занятость, то есть
# садится ровно на свободные номера — на те самые, что пул готовится выдать
# следующему замеру. Проверено на CentOS: при совмещённых диапазонах 30 %
# замеров получают «address already in use» на законно выданном порту,
# при разведённых — ни одного (см. portlease_linux_test.go).
#
# Считать бюджет портов надо на два номера за замер TWamp:
#
#   * UDP-порт тестового сокета — из пула пробы;
#   * TCP-порт управляющего канала twping — эфемерный, отсюда.
#
# Отсюда раскладка: 24 тысячи эфемерных на управляющие каналы, 41 тысяча
# в пуле на тестовые сокеты, Probe:MaxParallel = 20000 — ниже обоих, с запасом
# на карантин и отлёживание. Больше 32 тысяч одновременных замеров TWamp
# на один адрес не выйдет в принципе: 2 × 32000 уже не помещается в 64 512
# доступных номеров.
#
# Меняете Probe:PortRange или MaxParallel — пересчитайте и эту строку. Проба
# сверяет всё это при старте и предупреждает, если бюджет не сходится.
net.ipv4.ip_local_port_range = 1024 24999

# Ускоряет возврат портов из TIME_WAIT для исходящих соединений.
net.ipv4.tcp_tw_reuse = 1

# Очередь приёма для HTTP-сервера пробы: сервер опрашивает её пачками задач.
net.core.somaxconn = 4096
