# Настройки ядра для SPI TWamp Probe (CentOS/RHEL и другие Linux).
# Кладётся в /etc/sysctl.d/99-twamp-probe.conf, применяется: sysctl --system
#
# Смысл всех значений один: проба на пике держит тысячи процессов зондов, и
# каждый такой замер занимает две учётные единицы ядра — сам процесс и поток
# пробы, ожидающий его завершения.

# Идентификаторы задач. Их расходуют и процессы, и потоки, поэтому N замеров
# внешними утилитами требуют около 2N идентификаторов — плюс всё остальное,
# что работает на машине. Значение по умолчанию (32768) кончается быстро;
# 4194304 — максимум для 64-битных ядер.
kernel.pid_max = 4194304

# Общее число потоков в системе. По умолчанию вычисляется из объёма памяти и
# обычно достаточно, но на машинах с малым ОЗУ оказывается тесным.
kernel.threads-max = 262144

# Верхняя граница для LimitNOFILE: без неё systemd не сможет поднять лимит
# дескрипторов службе.
fs.nr_open = 1048576

# Диапазон исходящих портов ядра. Совпадает с пулом пробы (Probe:PortRange)
# намеренно: каждому замеру TWamp нужно исходящее TCP-соединение под
# управляющий канал twping, и брать его ядру больше неоткуда. Отдай ядру
# только участок ниже пула — и число одновременных замеров TWamp упёрлось бы
# в размер этого участка, сколько бы портов ни лежало в пуле.
#
# Плата за это — пересечение по UDP. Пул раздаёт UDP-порты сам, а ядро из того
# же диапазона выдаёт эфемерные порты чужим UDP-сокетам машины (в первую
# очередь резолверу DNS). Изредка чужой сокет встаёт на номер, законно выданный
# замеру: тогда зонд получает «address already in use», проба уводит порт
# в карантин на 5 минут и повторяет замер с другим номером. На пуле в 56 тысяч
# портов такие совпадения единичны.
#
# Пространства TCP и UDP у ядра раздельные, поэтому управляющие соединения
# twping пул не расходуют и с ним не сталкиваются вовсе.
#
# Если коллизий станет много (в состоянии пробы растёт «в карантине»), разведите
# диапазоны: отдайте ядру нижний участок (например 1024 15999), а пулу — всё
# выше (Probe:PortRange = 16000-65000). Ценой станет потолок замеров TWamp,
# равный размеру участка ядра.
net.ipv4.ip_local_port_range = 9000 65000

# Ускоряет возврат портов из TIME_WAIT для исходящих соединений.
net.ipv4.tcp_tw_reuse = 1

# Очередь приёма для HTTP-сервера пробы: сервер опрашивает её пачками задач.
net.core.somaxconn = 4096
